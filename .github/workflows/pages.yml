name: Deploy website and news

# Builds the site and collects the latest UPSC headlines every hour.
# GitHub Pages switches to a new version only after it is fully uploaded, and
# any failed step stops the deploy, so the live site is never taken down.
on:
  push:
    branches: [main, claude/modest-knuth-jpz4zd]
  schedule:
    - cron: "17 * * * *" # every hour at :17 (GitHub may delay scheduled runs a little)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Fetch today's headlines
        # Keeps earlier headlines from the live site so the list builds up through the day.
        run: node --experimental-strip-types scripts/fetch-news.ts dist/news.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
