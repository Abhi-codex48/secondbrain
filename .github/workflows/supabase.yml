name: Set up Supabase (database + server functions)

# Run this by hand from the Actions tab after adding the secrets listed in the README.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Create tables and security rules
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Store AI keys on the server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args=""
          [ -n "$GROQ_API_KEY" ] && args="$args GROQ_API_KEY=$GROQ_API_KEY"
          [ -n "$GEMINI_API_KEY" ] && args="$args GEMINI_API_KEY=$GEMINI_API_KEY"
          if [ -n "$args" ]; then supabase secrets set $args --project-ref "$PROJECT_REF"; else echo "No AI keys given; summaries stay off."; fi
      - name: Deploy server functions
        run: |
          for f in news-sync fetch-article summarise; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
          done
