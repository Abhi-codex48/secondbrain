<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d4aff" />
    <title>Second Brain</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load in the background so they never hold up the first screen. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <script>
      try { var m = localStorage.getItem("sb-mode"); if (m === "dark") document.documentElement.dataset.mode = "dark"; } catch (e) {}
    </script>
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fbfaff; font-family: system-ui, sans-serif; }
      [data-mode="dark"] .boot { background: #14111f; }
      .boot > div { display: grid; justify-items: center; gap: 18px; }
      .boot img { width: 64px; height: 64px; animation: boot-pop 1.4s cubic-bezier(.2,.8,.2,1) infinite; }
      .boot i { display: block; width: 120px; height: 4px; border-radius: 4px; background: rgba(124,77,255,.15); overflow: hidden; position: relative; }
      .boot i::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #ff6a3d, #7c4dff, #12b5a5); animation: boot-bar 1.1s ease-in-out infinite; }
      @keyframes boot-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes boot-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><div><img src="./icon.svg" alt="" /><i></i></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
